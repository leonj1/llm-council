services:
  mysql-test:
    image: mysql:8.0
    container_name: llm-council-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: llm_council
    ports:
      - "3306:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptestpass"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/mysql

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: llm-council-test-runner
    depends_on:
      mysql-test:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql-test
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: testpass
      MYSQL_DATABASE: llm_council
